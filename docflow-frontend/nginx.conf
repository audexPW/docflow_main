server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;

    # Проксируем API на бэкенд DocFlow.
    # docflow-backend:8080 — имя сервиса в docker-compose бэкенда.
    location /api/ {
        proxy_pass http://docflow-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://docflow-backend:8080;
    }

    # SPA: любой неизвестный путь отдаём на index.html (клиентский роутинг).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
